name: Apply layered release refactor

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - agent/layered-release

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.actor != 'github-actions[bot]' &&
      ((github.event_name == 'pull_request' && github.head_ref == 'agent/layered-release') ||
       (github.event_name == 'push' && github.ref_name == 'agent/layered-release'))
    runs-on: ubuntu-latest
    steps:
      - name: Apply reviewed source payload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          git clone --quiet --branch "$TARGET_BRANCH" \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repository
          cd repository
          cat .agent-payload/part* > /tmp/payload.b64
          python3 - <<'PYCODE'
          from __future__ import annotations

          import base64
          import io
          from pathlib import Path, PurePosixPath
          import tarfile

          encoded = "".join(Path("/tmp/payload.b64").read_text().split())
          payload = base64.b64decode(encoded, validate=True)
          with tarfile.open(fileobj=io.BytesIO(payload), mode="r:gz") as stream:
              members = stream.getmembers()
              for member in members:
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or ".." in path.parts or not member.isfile():
                      raise SystemExit(f"unsafe payload member: {member.name}")
              stream.extractall(Path.cwd(), members=members, filter="data")
          PYCODE
          rm -rf .agent-payload .github/workflows/agent-layered-release.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check -- . ':(exclude)patches/*.patch'
          git commit -m "Generalize layered repository releases"
          git push origin HEAD:"$TARGET_BRANCH"
